<!DOCTYPE html>
<html>
<head>
    <title>Digital Board</title>

    <style>
        body {
            margin: 0;
            background: #ddd;
        }

        .board {
            width: 600px;
            height: 350px;
            background: white;
            border: 10px solid #444;
            margin: 50px auto;
            position: relative;
            box-shadow: 0 5px 10px #777;
        }

        /* Green block - top left */
        .green1 {
            position: absolute;
            left: 0;
            top: 0;
            width: 45%;
            height: 35%;
            background: #7bd34c;
        }

        /* Red block - top right */
        .red1 {
            position: absolute;
            right: 0;
            top: 0;
            width: 30%;
            height: 35%;
            background: #f25b4b;
        }

        /* Yellow block - middle left */
        .yellow {
            position: absolute;
            left: 0;
            top: 35%;
            width: 45%;
            height: 35%;
            background: #fff3a8;
        }

        /* Red block - middle */
        .red2 {
            position: absolute;
            left: 45%;
            top: 35%;
            width: 30%;
            height: 35%;
            background: #f25b4b;
        }

        /* Green block - right */
        .green2 {
            position: absolute;
            right: 0;
            top: 35%;
            width: 25%;
            height: 65%;
            background: #8bcf62;
        }
        .white {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 45%;
            height: 30%;
            background: white;
        }
        
    </style>
</head>
<body>

    <div class="board">

        <div class="green1 "></div>

        <div class="red1"></div>

        <div class="yellow"></div>

        <div class="red2"></div>

        <div class="green2"></div>

        <div class="white"></div>

    </div>

</body>
</html>
